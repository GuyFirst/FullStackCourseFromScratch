<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    /* Write your CSS Code here */
    .flag{
      background-color: #CE1126;
      width:900px;
      height:600px;
      position: relative;
    }
    .flag p{
      color: #fff;
      text-align: center;
    }
    /* blue rect */
    .flag > div{
      background-color: #002868;
      position: absolute;
      height:300px;
      width:100%;
      top: 150px;

    }
    .flag > div > div > p{
      color:#000;
      margin-top: 5px;
    }
    /*the circle*/
    .flag > div > div{
      background-color: #fff;
      width:200px;
      height:200px;
      border-radius: 50%;
      position: absolute;
      left:350px;
      top:50px
    }
    p{
      font-size: 5rem;
      margin:0;
    }
  </style>
</head>
<!-- 
  IMPORTANT! Do not change any HTML
Don't add any classes/ids/elements 
Use what you know about combining selectors 
and CSS specificity instead.
 Laos red #ce1126
 Laos blue #002868
Hint 1: The flag is 900px by 600px and the circle is 200px by 200px.
Hint 2: You can use CSS inspection to get the colors from
https://appbrewery.github.io/flag-of-laos/
-->

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
