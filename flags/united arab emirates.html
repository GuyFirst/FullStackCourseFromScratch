<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .container {
    height: 100vh;
    display: grid;
    grid-template-columns: 25% 75%; 
    grid-template-rows: repeat(3, 1fr);
  }

  .red {
    background-color: #a6192e;
    grid-row: span 3
  }

  .green {
  background-color: #00534c;
  grid-row: 1;
  grid-column: 2;
}

.white {
  background-color: white;
  grid-row: 2;
  grid-column: 2;
}

.black {
  background-color: black;
  grid-row: 3;
  grid-column: 2;
}

</style>

<body>
  
<div class = "container">
  <div class ="red"></div>
  <div class ="green"></div>
  <div class ="white"></div>
  <div class ="black"></div>

</div>

</body>
</html>
